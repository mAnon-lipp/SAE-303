<aside class="detail-panel" data-state="closed">
  <button class="detail-panel__close" aria-label="Fermer le panneau">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  
  <div class="detail-panel__content">
    <h2 class="detail-panel__code" data-field="code"></h2>
    
    <p class="detail-panel__libelle" data-field="libelle"></p>
    
    <div class="detail-panel__progress">
      <h3 class="detail-panel__progress-title">Niveau de savoir</h3>
      <div class="detail-panel__slider-container">
        <input 
          type="range" 
          id="progress-slider" 
          class="detail-panel__slider"
          data-field="slider"
          min="0" 
          max="100" 
          value="0"
          step="1"
        />
        <div class="detail-panel__progress-fill" data-field="progress" style="width: 0%"></div>
      </div>
      <span class="detail-panel__progress-value" data-field="progress-value">0%</span>
      <button class="detail-panel__validate-btn" data-field="validate-btn">Valider</button>
    </div>
  </div>
</aside>
